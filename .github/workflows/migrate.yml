name: Apply migrations

# Schema changes ship with the code that needs them. Each environment is an
# explicit job so no matrix expression can receive broad access to repository
# secrets or choose a secret name dynamically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-migrations
  cancel-in-progress: false

jobs:
  production:
    name: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Check environment is configured
        id: configured
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::PRODUCTION_DATABASE_URL is not set — skipping production."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Schema state before
        if: steps.configured.outputs.ready == 'true'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm db:drift

      - name: Apply migrations
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Re-apply row-level security
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          OPENPIMS_APP_DB_PASSWORD: ${{ secrets.OPENPIMS_APP_DB_PASSWORD }}
        run: pnpm db:rls

      - name: Verify schema matches the code
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm db:drift

  demo:
    name: demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Check environment is configured
        id: configured
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DEMO_DATABASE_URL is not set — skipping demo."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Schema state before
        if: steps.configured.outputs.ready == 'true'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
        run: pnpm db:drift

      - name: Apply migrations
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Re-apply row-level security
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          OPENPIMS_APP_DB_PASSWORD: ${{ secrets.OPENPIMS_APP_DB_PASSWORD }}
        run: pnpm db:rls

      - name: Verify schema matches the code
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
        run: pnpm db:drift
