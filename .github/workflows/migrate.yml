name: Apply migrations

# Each environment is an explicit job so no matrix expression can receive
# broad access to repository secrets or choose a secret name dynamically.
# Nonproduction jobs remain manual until isolated resources and fingerprints
# have passed the credential-isolation canary.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to migrate
        required: true
        type: choice
        default: development
        options:
          - development
          - staging
          - demo
          - production
      production_confirmation:
        description: Type MIGRATE_PRODUCTION for a production run
        required: false
        type: string
      staging_confirmation:
        description: Type MIGRATE_STAGING for a staging run
        required: false
        type: string
      release_sha:
        description: Exact 40-character commit on the target canonical branch
        required: true
        type: string

permissions:
  contents: read

jobs:
  reject-invalid-production-dispatch:
    name: reject invalid production dispatch
    if: inputs.target == 'production' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Production migration dispatches must run from the main branch."
          exit 1

  validate-nonproduction-request:
    name: validate nonproduction request
    if: inputs.target != 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Require exact canonical ref and revision
        env:
          TARGET: ${{ inputs.target }}
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_CONFIRMATION: ${{ inputs.staging_confirmation }}
        run: |
          case "$TARGET" in
            development) expected_ref="refs/heads/development" ;;
            staging) expected_ref="refs/heads/staging" ;;
            demo) expected_ref="refs/heads/main" ;;
            *)
              echo "::error::Unsupported nonproduction migration target."
              exit 1
              ;;
          esac
          if [ "$GITHUB_REF" != "$expected_ref" ]; then
            echo "::error::Migration target must run from its canonical branch."
            exit 1
          fi
          if [[ ! "$REQUESTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$REQUESTED_RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Migration release SHA must match the exact dispatched commit."
            exit 1
          fi
          if [ "$TARGET" = "staging" ] && [ "$STAGING_CONFIRMATION" != "MIGRATE_STAGING" ]; then
            echo "::error::Staging migration confirmation did not match MIGRATE_STAGING."
            exit 1
          fi

  validate-production-request:
    name: validate production request
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Require exact revision confirmation
        env:
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [ "$PRODUCTION_CONFIRMATION" != "MIGRATE_PRODUCTION" ]; then
            echo "::error::Production migration confirmation did not match MIGRATE_PRODUCTION."
            exit 1
          fi
          if [[ ! "$REQUESTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$REQUESTED_RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Production migration release SHA must match the exact dispatched main commit."
            exit 1
          fi

  production:
    name: production
    needs: validate-production-request
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'production'
    environment: Production
    concurrency:
      group: apply-migrations-production
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Require production database credentials
        id: configured
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          APP_DB_PASSWORD: ${{ secrets.OPENPIMS_APP_DB_PASSWORD }}
        run: |
          if [[ -z "$DATABASE_URL" || "$DATABASE_URL" =~ ^[[:space:]]*$ ]]; then
            echo "::error::PRODUCTION_DATABASE_URL is not configured."
            exit 1
          fi
          if [[ -z "$APP_DB_PASSWORD" || "$APP_DB_PASSWORD" =~ ^[[:space:]]*$ ]]; then
            echo "::error::OPENPIMS_APP_DB_PASSWORD is not configured."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Schema state before
        if: steps.configured.outputs.ready == 'true'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm db:drift

      - name: Verify RLS deployment ownership
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm db:rls:preflight

      - name: Apply migrations
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Re-apply row-level security
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          OPENPIMS_APP_DB_PASSWORD: ${{ secrets.OPENPIMS_APP_DB_PASSWORD }}
        run: pnpm db:rls

      - name: Verify schema matches the code
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm db:drift

  development:
    name: development
    needs: validate-nonproduction-request
    if: inputs.target == 'development'
    environment: Development
    concurrency:
      group: apply-migrations-development
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Verify committed migration history
        run: pnpm --filter @openpims/db db:migrations:check
      - name: Require environment-scoped database controls
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_DB_PASSWORD: ${{ secrets.OPENPIMS_APP_DB_PASSWORD }}
          TARGET_FINGERPRINT: ${{ vars.DATABASE_TARGET_FINGERPRINT }}
          FORBIDDEN_FINGERPRINTS: ${{ vars.FORBIDDEN_DATABASE_TARGET_FINGERPRINTS }}
        run: |
          for value in "$DATABASE_URL" "$APP_DB_PASSWORD" "$TARGET_FINGERPRINT" "$FORBIDDEN_FINGERPRINTS"; do
            if [[ -z "$value" || "$value" =~ ^[[:space:]]*$ ]]; then
              echo "::error::Development database controls are not configured."
              exit 1
            fi
          done
      - name: Verify Development code contract (synthetic)
        env:
          OPENVPM_ENVIRONMENT: development
          HOSTED_BILLING_ENABLED: "true"
        run: pnpm --filter @openpims/web environment:validate
      - name: Verify database target identity
        env:
          OPENVPM_ENVIRONMENT: development
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_TARGET_FINGERPRINT: ${{ vars.DATABASE_TARGET_FINGERPRINT }}
          FORBIDDEN_DATABASE_TARGET_FINGERPRINTS: ${{ vars.FORBIDDEN_DATABASE_TARGET_FINGERPRINTS }}
        run: pnpm db:target:check
      - name: Verify applied history is a committed prefix
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_CONFORMANCE_MODE: prefix
        run: pnpm db:migrations:conformance
      - name: Schema state before
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:drift
      - name: Verify RLS deployment ownership
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:rls:preflight
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate
      - name: Re-apply row-level security
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENPIMS_APP_DB_PASSWORD: ${{ secrets.OPENPIMS_APP_DB_PASSWORD }}
        run: pnpm db:rls
      - name: Verify schema matches the code
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:drift
      - name: Verify exact applied migration history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_CONFORMANCE_MODE: exact
        run: pnpm db:migrations:conformance

  staging:
    name: staging
    needs: validate-nonproduction-request
    if: inputs.target == 'staging'
    environment: Staging
    concurrency:
      group: apply-migrations-staging
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Verify committed migration history
        run: pnpm --filter @openpims/db db:migrations:check
      - name: Require environment-scoped database controls
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          APP_DB_PASSWORD: ${{ secrets.OPENPIMS_APP_DB_PASSWORD }}
          STAGING_PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
          TARGET_FINGERPRINT: ${{ vars.DATABASE_TARGET_FINGERPRINT }}
          FORBIDDEN_FINGERPRINTS: ${{ vars.FORBIDDEN_DATABASE_TARGET_FINGERPRINTS }}
        run: |
          for value in "$DATABASE_URL" "$APP_DB_PASSWORD" "$STAGING_PROJECT_REF" "$TARGET_FINGERPRINT" "$FORBIDDEN_FINGERPRINTS"; do
            if [[ -z "$value" || "$value" =~ ^[[:space:]]*$ ]]; then
              echo "::error::Staging database controls are not configured."
              exit 1
            fi
          done
      - name: Verify Staging code contract (synthetic)
        env:
          OPENVPM_ENVIRONMENT: staging
          HOSTED_BILLING_ENABLED: "true"
        run: pnpm --filter @openpims/web environment:validate
      - name: Reject protected or mismatched staging project
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
        run: pnpm --filter @openpims/web staging:verify-database-target
      - name: Verify database target identity
        env:
          OPENVPM_ENVIRONMENT: staging
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_TARGET_FINGERPRINT: ${{ vars.DATABASE_TARGET_FINGERPRINT }}
          FORBIDDEN_DATABASE_TARGET_FINGERPRINTS: ${{ vars.FORBIDDEN_DATABASE_TARGET_FINGERPRINTS }}
        run: pnpm db:target:check
      - name: Verify applied history is a committed prefix
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          MIGRATION_CONFORMANCE_MODE: prefix
        run: pnpm db:migrations:conformance
      - name: Schema state before
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:drift
      - name: Verify RLS deployment ownership
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:rls:preflight
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:migrate
      - name: Re-apply row-level security
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          OPENPIMS_APP_DB_PASSWORD: ${{ secrets.OPENPIMS_APP_DB_PASSWORD }}
        run: pnpm db:rls
      - name: Verify schema matches the code
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:drift
      - name: Verify exact applied migration history
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          MIGRATION_CONFORMANCE_MODE: exact
        run: pnpm db:migrations:conformance

  demo:
    name: demo
    needs: validate-nonproduction-request
    if: inputs.target == 'demo'
    environment: Demo
    concurrency:
      group: apply-migrations-demo
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Verify committed migration history
        run: pnpm --filter @openpims/db db:migrations:check
      - name: Require environment-scoped database controls
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_DB_PASSWORD: ${{ secrets.OPENPIMS_APP_DB_PASSWORD }}
          TARGET_FINGERPRINT: ${{ vars.DATABASE_TARGET_FINGERPRINT }}
          FORBIDDEN_FINGERPRINTS: ${{ vars.FORBIDDEN_DATABASE_TARGET_FINGERPRINTS }}
        run: |
          for value in "$DATABASE_URL" "$APP_DB_PASSWORD" "$TARGET_FINGERPRINT" "$FORBIDDEN_FINGERPRINTS"; do
            if [[ -z "$value" || "$value" =~ ^[[:space:]]*$ ]]; then
              echo "::error::Demo database controls are not configured."
              exit 1
            fi
          done
      - name: Verify Demo code contract (synthetic)
        env:
          OPENVPM_ENVIRONMENT: demo
          HOSTED_BILLING_ENABLED: "false"
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: pnpm --filter @openpims/web environment:validate
      - name: Verify database target identity
        env:
          OPENVPM_ENVIRONMENT: demo
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_TARGET_FINGERPRINT: ${{ vars.DATABASE_TARGET_FINGERPRINT }}
          FORBIDDEN_DATABASE_TARGET_FINGERPRINTS: ${{ vars.FORBIDDEN_DATABASE_TARGET_FINGERPRINTS }}
        run: pnpm db:target:check
      - name: Verify applied history is a committed prefix
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_CONFORMANCE_MODE: prefix
        run: pnpm db:migrations:conformance
      - name: Schema state before
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:drift
      - name: Verify RLS deployment ownership
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:rls:preflight
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate
      - name: Re-apply row-level security
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENPIMS_APP_DB_PASSWORD: ${{ secrets.OPENPIMS_APP_DB_PASSWORD }}
        run: pnpm db:rls
      - name: Verify schema matches the code
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:drift
      - name: Verify exact applied migration history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_CONFORMANCE_MODE: exact
        run: pnpm db:migrations:conformance
