name: CI

on:
  push:
    branches: [development, staging, main]
  # Stacked pull requests must receive the same release evidence as PRs aimed
  # directly at a controlled branch. Restrict pushes, not review candidates.
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sha256sum --check
          tar --extract --gzip \
            --file "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" \
            --directory "$RUNNER_TEMP" \
            gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan tracked source for secrets
        run: pnpm verify:secrets

      - run: pnpm install --frozen-lockfile

      - name: Verify public release contents
        run: pnpm verify:oss-release

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint application correctness
        run: pnpm lint

      - run: pnpm type-check

      - run: pnpm test

      - run: pnpm build

      - name: Scan deployable build artifacts for secrets
        run: pnpm verify:secret-artifacts

  clinic-readiness:
    name: Golden clinic workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openpims
          POSTGRES_PASSWORD: openpims
          POSTGRES_DB: openpims
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openpims"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The Playwright runner uses the owner only to create synthetic fixtures
      # and verify postconditions. Its web server command below overrides
      # DATABASE_URL so every product request runs as the RLS-constrained role.
      DATABASE_URL: postgresql://openpims:openpims@localhost:5432/openpims
      OPENPIMS_APP_DB_PASSWORD: openpims_app
      HOSTED_BILLING_ENABLED: "true"
      ENFORCE_RLS_BOOT_ASSERTION: "true"
      NEXT_PUBLIC_DEMO_MODE: "false"
      NEXTAUTH_SECRET: ci-only-synthetic-nextauth-secret-not-for-deployment
      NEXTAUTH_URL: http://localhost:3000
      EMAIL_PREFERENCE_IDENTITY_SECRET: ci-only-synthetic-identity-secret-not-for-deployment
      EMAIL_PREFERENCE_SIGNING_SECRET: ci-only-synthetic-signing-secret-not-for-deployment
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PLAYWRIGHT_WEB_SERVER_COMMAND: DATABASE_URL=postgresql://openpims_app:openpims_app@localhost:5432/openpims pnpm --filter @openpims/web dev
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: OpenVPM CI
      WEBAUTHN_ORIGINS: http://localhost:3000
      WEBAUTHN_ADMIN_POLICY: migration

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install isolated browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations and least-privilege RLS
        run: |
          pnpm --filter @openpims/db db:migrate
          pnpm --filter @openpims/db db:rls

      - name: Prove the golden clinic workflow and real WebAuthn ceremonies
        run: pnpm exec playwright test e2e/multi-clinic-launch-readiness.spec.ts e2e/passkey-cryptographic.spec.ts --workers=1 --reporter=line

  migration-integrity:
    name: Migration history integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The append-only check resolves the actual merge base and compares
          # every pre-existing SQL/snapshot byte plus every journal entry.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Verify append-only migration history
        env:
          MIGRATION_INTEGRITY_EVENT_NAME: ${{ github.event_name }}
          MIGRATION_INTEGRITY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MIGRATION_INTEGRITY_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: pnpm --filter @openpims/db db:migrations:check

  rls:
    name: RLS tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openpims
          POSTGRES_PASSWORD: openpims
          POSTGRES_DB: openpims
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openpims"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://openpims:openpims@localhost:5432/openpims
      OPENPIMS_APP_DB_PASSWORD: openpims_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Apply committed migrations, apply RLS (+ least-priv role), then prove
      # tenant isolation against a real Postgres on every PR.
      - run: pnpm --filter @openpims/db db:migrate

      - name: Verify migrated ledger exactly matches committed history
        env:
          MIGRATION_CONFORMANCE_MODE: exact
        run: pnpm --filter @openpims/db db:migrations:conformance

      - name: Execute RLS ownership preflight contract
        run: pnpm --filter @openpims/db db:rls:preflight:test

      # A data-only migration has no schema snapshot to prove it ran. Exercise
      # the baseline command against a disposable database and prove that exact
      # and later cutoffs both fail without a ledger until live data is safe.
      - name: Execute snapshotless baseline safety contract
        env:
          BASELINE_POSTCONDITION_DB_INTEGRATION: "1"
        run: pnpm --filter @openpims/web exec vitest run lib/__tests__/baseline-postconditions.integration.test.ts

      # Schema drift guard: if drizzle-kit generate produces anything, a schema
      # change was committed without its migration (or a migration was written
      # without its snapshot, which silently re-emits old DDL forever).
      - name: Check schema matches committed migrations
        run: |
          pnpm --filter @openpims/db db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::Schema and committed migrations are out of sync — run pnpm db:generate and commit the result."
            git status --porcelain packages/db/drizzle
            exit 1
          fi

      - run: pnpm --filter @openpims/db db:rls

      - name: Execute managed release-line reconciliation contract
        run: pnpm --filter @openpims/db db:release-line:test

      # A step-up cookie is insufficient by itself: prove the exact-action row
      # can be consumed only once under races and remains tenant/privilege
      # constrained in the real least-privilege PostgreSQL role.
      - name: Execute privileged-action proof database contract
        run: pnpm --filter @openpims/db db:privileged-action-proofs:test

      # Passkeys are account-bound authentication evidence. Prove one-use
      # challenges, monotone credential lifecycle, races, privileges, and
      # tenant isolation against the restricted role in real PostgreSQL.
      - name: Execute WebAuthn credential and challenge database contract
        run: pnpm --filter @openpims/db db:webauthn:test

      # Recovery is dormant until owner policy approval, but its database core
      # must already prove dual control, atomic revocation, immutable evidence,
      # one-use grants, races, and system-only RLS under the restricted role.
      - name: Execute account-recovery database contract
        run: pnpm --filter @openpims/db db:auth-recovery:test

      - name: Execute immutable clinic-day close database contract
        env:
          FINANCIAL_CLOSE_DB_INTEGRATION: "1"
        run: pnpm --filter @openpims/web exec vitest run lib/billing/__tests__/financial-close.integration.test.ts

      - name: Execute subscription Checkout ownership database contract
        env:
          SUBSCRIPTION_CHECKOUT_DB_INTEGRATION: "1"
        run: pnpm --filter @openpims/db db:subscription-checkout:test

      - name: Execute subscription Checkout service transition contract
        env:
          SUBSCRIPTION_CHECKOUT_SERVICE_DB_INTEGRATION: "1"
        run: pnpm --filter @openpims/web exec vitest run lib/billing/__tests__/subscription-checkout-attempts.integration.test.ts

      # Cadence changes cross an immutable operation ledger, Stripe schedule
      # idempotency, signed webhook reconciliation, crash recovery, and
      # schedule-aware quantity updates. Prove both the database fences and
      # the protected application orchestration against real PostgreSQL.
      - name: Execute subscription cadence database contract
        run: pnpm --filter @openpims/db db:subscription-cadence:test

      - name: Execute subscription cadence service recovery contract
        env:
          SUBSCRIPTION_CADENCE_DB_INTEGRATION: "1"
        run: pnpm --filter @openpims/web exec vitest run lib/billing/__tests__/subscription-cadence-operations.integration.test.ts

      # Controlled-drug inventory is append-only regulatory evidence. Prove
      # retry identity, row-shape constraints, tenant-bound attribution, RLS,
      # and update/delete denial in real PostgreSQL as the restricted app role.
      - name: Execute controlled-substance ledger database contract
        run: pnpm --filter @openpims/db db:controlled-substance-ledger:test

      # Prescription headers are mutable projections over an append-only
      # lifecycle ledger. Prove tenant-bound clinical references, retry IDs,
      # row shape, RLS, and restricted snapshot mutation in real PostgreSQL.
      - name: Execute prescription integrity database contract
        run: pnpm --filter @openpims/db db:prescription-integrity:test

      # Lab result projections are mutable workflow state over immutable events.
      # Prove replacement chart identity and narrow projection privileges in
      # fully migrated, disposable PostgreSQL.
      - name: Execute lab result integrity database contract
        run: pnpm --filter @openpims/db db:lab-result-integrity:test

      # Vaccination rows are immutable clinical identity with narrowly mutable
      # certificate metadata. Prove tenant/chart references, date ordering,
      # veterinarian attribution, bounded updates, and delete denial.
      - name: Execute vaccination integrity database contract
        run: pnpm --filter @openpims/db db:vaccination-integrity:test

      # Subscription notices cross Stripe transactions, a durable outbox,
      # provider idempotency, and final-state suppression. Exercise atomic
      # enqueue, SKIP LOCKED workers, lease/CAS recovery, immutable attempts,
      # RLS, terminal outcomes, and the practice-row dispatch fence in the
      # fully migrated disposable PostgreSQL service.
      - name: Execute lifecycle-email outbox database contract
        env:
          LIFECYCLE_EMAIL_DB_INTEGRATION: "1"
        run: pnpm --filter @openpims/db db:lifecycle-email-outbox:test

      # Client treatment-plan decisions are legal record evidence. Prove the
      # sealed revision/response graph, signature hash binding, replay refusal,
      # immutable grants, and tenant/no-context isolation in real PostgreSQL.
      - name: Execute treatment-plan evidence contract
        run: |
          pnpm --filter @openpims/db db:treatment-plan-evidence:test
          pnpm --filter @openpims/db db:treatment-plan-concurrency:test

      # The staff authoring API is dark by default. Exercise the complete
      # protected route with the least-privilege app role against disposable
      # real PostgreSQL, including replay, rollback, RLS, and two-writer races.
      - name: Execute treatment-plan staff authoring contract
        env:
          TREATMENT_PLAN_AUTHORING_DB_INTEGRATION: "1"
          TREATMENT_PLAN_AUTHORING_ENABLED: "true"
        run: pnpm --filter @openpims/web exec vitest run server/__tests__/visit-treatment-plan-authoring.integration.test.ts

      # Recreate the exact staging-era 0093 state in a disposable database,
      # preserve existing settlement evidence through 0094, advance through
      # later migrations, and attack every finance tenant/privilege boundary
      # with the restricted application role under the current RLS contract.
      - name: Execute finance schema adoption contract
        run: pnpm --filter @openpims/db db:finance-adoption:test

      # Platform acquisition outcomes aggregate across clinic tenants. Exercise
      # the exact query as openpims_app and prove system-only access, no-context
      # isolation, privacy filters, and cohort-versus-period semantics.
      - name: Execute acquisition outcomes database contract
        env:
          JOURNEY_FUNNEL_DB_INTEGRATION: "1"
        run: pnpm --filter @openpims/web exec vitest run lib/__tests__/journey-funnel.integration.test.ts

      # Onboarding evidence is a tenant-owned CAS state machine stored in the
      # existing practice JSONB document. Prove row-lock serialization,
      # revision conflicts, terminal/idempotent behavior, rollback, and RLS
      # context cleanup through the real protected router and app role.
      - name: Execute onboarding journey writer database contract
        env:
          ONBOARDING_JOURNEY_WRITER_DB_INTEGRATION: "1"
        run: pnpm --filter @openpims/web exec vitest run server/__tests__/onboarding-journey-writer.integration.test.ts

      # Exercise the clinic-facing patient + owner search through the real
      # router and least-privilege RLS role. The fixture proves literal LIKE
      # escaping, deterministic bounds, context cleanup, and cross-tenant deny.
      - name: Execute patient and owner search database contract
        env:
          PATIENT_SEARCH_DB_INTEGRATION: "1"
        run: pnpm --filter @openpims/web exec vitest run server/__tests__/patient-search.integration.test.ts

      # Steven Dennis's long-chart workflow crosses multiple clinical tables.
      # Exercise the exact read-only POST projection as openpims_app, including
      # literal matching, lifecycle lineage, keyset paging, role gates, RLS,
      # clinic-local dates, and high-cardinality query-plan evidence.
      - name: Execute patient history search contract
        env:
          PATIENT_HISTORY_DB_INTEGRATION: "1"
        run: pnpm --filter @openpims/web exec vitest run server/__tests__/patient-history.integration.test.ts

      # Template catalog selection is a clinic-facing data boundary. Exercise
      # the real router as the least-privilege app role and prove literal,
      # bounded, deterministic, active-only, tenant-isolated search behavior.
      - name: Execute template catalog search contract
        env:
          TEMPLATE_CATALOG_DB_INTEGRATION: "1"
        run: pnpm --filter @openpims/web exec vitest run server/__tests__/template-catalog-search.integration.test.ts

      # Steven Dennis exposed a real route-level patient merge 500 caused by
      # changing isolation inside a nested savepoint. Exercise the protected
      # router as openpims_app and prove the event is written in the outer
      # SERIALIZABLE tenant transaction with replay and RLS cleanup intact.
      - name: Execute patient merge transaction contract
        env:
          PATIENT_MERGE_DB_INTEGRATION: "1"
        run: pnpm --filter @openpims/web exec vitest run server/__tests__/patient-merge-transaction.integration.test.ts

      # A refill can belong to an older prescription while its dispense charge
      # belongs to the current visit. Prove the queue row remains visible in
      # closeout history and blocks checkout/financial handoff under RLS.
      - name: Execute visit-dispense closure contract
        env:
          VISIT_DISPENSE_DB_INTEGRATION: "1"
        run: pnpm --filter @openpims/web exec vitest run server/__tests__/visit-dispense-closure.integration.test.ts

      # Converting an estimate is one stock-owning state transition. Prove that
      # concurrent visit billing converges, tracked stock changes once, and all
      # stock/invoice/audit writes roll back together under least-privilege RLS.
      - name: Execute estimate conversion database contract
        env:
          BILLING_CONVERSION_DB_INTEGRATION: "1"
        run: pnpm --filter @openpims/web exec vitest run server/__tests__/billing-estimate-conversion.integration.test.ts

      # Compile, bind, and execute the exact read-only SQL used by the shared
      # platform-admin and daily SMS operations queues. Unit tests cannot catch
      # postgres.js timestamp encoders or correlated identifier rendering.
      - name: Execute SMS operations queue SQL
        env:
          SMS_QUEUE_DB_INTEGRATION: "1"
        run: pnpm --filter @openpims/web exec vitest run lib/messaging/__tests__/sms-operations-queues.integration.test.ts

      # Execute the immutable provider-resolution insert validations and
      # evidence assertions against the fully migrated disposable database.
      - name: Execute SMS provider-resolution database contract
        run: pnpm --filter @openpims/db db:sms-provider-resolutions:test

      # Exercise real PostgreSQL row/advisory locks, savepoints, and durable
      # event convergence with synthetic data only. No provider adapter is
      # imported or called, and every hosted SMS capability remains disabled.
      - name: Execute provider-free SMS concurrency drill
        env:
          SMS_CONCURRENCY_DB_INTEGRATION: "1"
          MESSAGING_PROVISIONING_ENABLED: "false"
          MESSAGING_INBOUND_ENABLED: "false"
          MESSAGING_SENDING_ENABLED: "false"
        run: pnpm --filter @openpims/web exec vitest run lib/messaging/__tests__/sms-concurrency-drill.integration.test.ts

      # The reminder sweep is a candidate list. Prove against real PostgreSQL
      # that dispatch-time revalidation honors clinic enablement, each clinic's
      # lead window, cancellation, and rescheduling before a provider claim.
      - name: Execute appointment reminder policy SQL
        env:
          REMINDER_POLICY_DB_INTEGRATION: "1"
        run: pnpm --filter @openpims/web exec vitest run lib/messaging/__tests__/appointment-reminder-eligibility.integration.test.ts

      - name: Prove tenant/RLS pool-reuse isolation
        run: pnpm --filter @openpims/db db:rls:test

      - run: pnpm --filter @openpims/db db:migration-runs:test
