services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: openpims
      POSTGRES_PASSWORD: openpims
      POSTGRES_DB: openpims
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpims"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Keep the service and volume names so existing S3 endpoints still work.
    # PGSTY Silo maintains the MinIO-compatible server and bundles mcli.
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: openpims
      MINIO_ROOT_PASSWORD: openpims123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio-bootstrap:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for attempt in $$(seq 1 60); do
          if mcli alias set local http://minio:9000 openpims openpims123; then
            exec mcli mb --ignore-existing local/openpims
          fi
          sleep 1
        done
        echo "Object storage was not ready after 60 attempts" >&2
        exit 1

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://openpims:openpims@postgres:5432/openpims"
      NEXTAUTH_SECRET: "docker-dev-secret-change-in-production"
      NEXTAUTH_URL: "http://localhost:3000"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "openpims"
      S3_SECRET_KEY: "openpims123"
      S3_BUCKET: "openpims"
      S3_REGION: "us-east-1"
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
